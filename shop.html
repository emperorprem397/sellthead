<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — SELLTHEAD</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&family=Montserrat:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body class="inner-page">
<!-- INNER PAGE TOPBAR (fixed, simple) -->
<div id="innerTopbar">
  <div class="inner-topbar-inner">
    <a href="index.html" class="nav-logo">
      <img src="images/logo_icon.png" alt="S" class="nav-logo-svg" onerror="this.style.display='none'" />
      <span class="logo-text">SELLTHEAD</span>
    </a>
    <div style="display:flex;align-items:center;gap:1.2rem">
      <a href="shop.html" style="font-family:var(--font-montserrat);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--white2);transition:color .2s" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--white2)'">SHOP</a>
      <a href="index.html#collabs" style="font-family:var(--font-montserrat);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--white2);transition:color .2s" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--white2)'">COLLABS</a>
      <a href="myorders.html" style="font-family:var(--font-montserrat);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--white2);transition:color .2s" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--white2)'">ORDERS</a>
    </div>
    <div style="display:flex;align-items:center;gap:.5rem">
      <button class="nav-icon" id="loginBtn" title="Login / Register">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <button class="cart-pill" id="cartBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-pill-label">CART (<span id="cartCount">0</span>)</span>
      </button>
    </div>
  </div>
</div>
</div>
<div id="cursorRing"></div>

<div class="cart-bg" id="cartBg"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-sidebar-header"><h3>YOUR CART</h3><button id="closeCart">✕</button></div>
  <div class="cart-sidebar-items" id="cartItems"></div>
  <div class="cart-sidebar-footer">
    <div class="cart-total"><span>TOTAL</span><span id="cartTotal">₹0</span></div>
    <a href="checkout.html" class="btn-red full-btn">CHECKOUT →</a>
  </div>
</div>

<div class="modal-bg" id="loginModal">
  <div class="modal-box">
    <button class="modal-close" id="closeLoginModal">✕</button>
    <div id="loginFormWrap">
      <h2>WELCOME BACK</h2>
      <input class="form-input" id="loginEmail" type="email" placeholder="Email address" />
      <input class="form-input" id="loginPassword" type="password" placeholder="Password" />
      <button class="btn-red full-btn" id="doLogin">LOGIN</button>
      <div class="auth-divider"><span>OR</span></div>
      <button class="btn-google full-btn" id="doGoogleLogin">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        CONTINUE WITH GOOGLE
      </button>
      <p class="switch-form">New here? <a href="#" id="goRegister">Create account</a> · <a href="#" id="goForgot" style="color:var(--white2)">Forgot password?</a></p>
    </div>
    <div id="registerFormWrap" style="display:none">
      <h2>CREATE ACCOUNT</h2>
      <input class="form-input" id="regName" type="text" placeholder="Full name" />
      <input class="form-input" id="regEmail" type="email" placeholder="Email address" />
      <input class="form-input" id="regPassword" type="password" placeholder="Password (min 6 chars)" />
      <button class="btn-red full-btn" id="doRegister">CREATE ACCOUNT</button>
      <div class="auth-divider"><span>OR</span></div>
      <button class="btn-google full-btn" id="doGoogleRegister">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        SIGN UP WITH GOOGLE
      </button>
      <p class="switch-form">Already have an account? <a href="#" id="goLogin">Login</a></p>
    </div>
    <div id="forgotFormWrap" style="display:none">
      <h2>RESET PASSWORD</h2>
      <input class="form-input" id="forgotEmail" type="email" placeholder="Your email address" />
      <button class="btn-red full-btn" id="doForgot">SEND RESET LINK</button>
      <p class="switch-form"><a href="#" id="goLoginFromForgot">← Back to login</a></p>
    </div>
  </div>
</div>

<div class="page-hero">
  <div class="section-label">— BROWSE ALL —</div>
  <h1>THE <span class="accent">SHOP</span></h1>
  <p class="section-desc" style="margin-top:.5rem">Premium anime &amp; streetwear tees</p>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-cat="all">ALL</button>
  <button class="filter-btn" data-cat="anime">ANIME</button>
  <button class="filter-btn" data-cat="compression">COMPRESSION</button>
  <button class="filter-btn" data-cat="oversized">OVERSIZED</button>
</div>

<div class="shop-grid-wrap">
  <div class="products-grid" id="shopGrid"></div>
</div>

<a href="https://wa.me/917568521210" class="wa-float" target="_blank">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>

<script src="js/firebase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
